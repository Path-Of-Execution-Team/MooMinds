name: Retrospective
description: Sprint review and improvement actions
title: "[Retro] Sprint "
labels: ["type:retro"]
body:
  - type: input
    id: sprint
    attributes:
      label: Sprint and dates
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What went well?
    validations:
      required: true
  - type: textarea
    id: improve
    attributes:
      label: What made work harder?
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Improvement actions
      description: Create a separate issue for each agreed action, with an owner and a review date.
    validations:
      required: true
