name: Technical task
description: Technical, documentation, or organizational work
title: "[Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Work to do
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Repositories and related issues
    validations:
      required: false
