name: User story
description: A user need or feature for the product backlog
title: "[Story] "
labels: ["type:story"]
body:
  - type: textarea
    id: goal
    attributes:
      label: User goal
      description: Who needs what, and why?
      placeholder: "As a ... I want ... so that ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions for completion
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and repositories
      description: API, GUI, Worker, or cross-component work; link related issues
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Assumptions and questions
    validations:
      required: false
